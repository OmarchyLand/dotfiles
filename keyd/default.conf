[ids]
*

[main]
# Home row mods: tap for the letter, hold for the modifier.
# overloadi: if the key is pressed within 150ms of the previous key (mid-word),
# it's always the letter. Otherwise overloadt2 decides tap vs hold (200ms).
a = overloadi(a, overloadt2(shift, a, 200), 150)
s = overloadi(s, overloadt2(control, s, 200), 150)
d = overloadi(d, overloadt2(alt, d, 200), 150)
f = overloadi(f, overloadt2(meta, f, 200), 150)

j = overloadi(j, overloadt2(meta, j, 200), 150)
k = overloadi(k, overloadt2(alt, k, 200), 150)
l = overloadi(l, overloadt2(control, l, 200), 150)
semicolon = overloadi(semicolon, overloadt2(shift, semicolon, 200), 150)

capslock = overload(supernav, esc)
z = overloadi(z, overloadt2(nav, z, 200), 150)
slash = overloadi(slash, overloadt2(workspace, slash, 200), 150)

[nav]
h = left
j = down
k = up
l = right

[supernav]
h = M-left
j = M-down
k = M-up
l = M-right

[workspace]
a = M-1
s = M-2
d = M-3
f = M-4
g = M-5
h = M-6
j = M-7
k = M-8
l = M-9

q = A-1
w = A-2
e = A-3
r = A-4
t = A-5
y = A-6
u = A-7
i = A-8
o = A-9

# tmux sessions 1-4 (bound to Alt+F9..F12 in ~/.config/tmux/tmux.conf)
z = A-f9
x = A-f10
c = A-f11
v = A-f12
