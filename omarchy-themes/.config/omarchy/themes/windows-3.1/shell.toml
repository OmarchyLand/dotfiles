# Windows 3.1 shell surfaces.
# The bar is a navy title bar with white caption text; menus and popups are
# white with a hard black frame; the highlighted row is navy with white text;
# dialogs (notifications, polkit) are button-face grey. Nothing is translucent.

[bar]
background       = "#000080"
background-alpha = 1.0
text             = "#ffffff"
active           = "#ffff00"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "#000080"
active-border-foreground = "#000000"

[controls]
# Push buttons: grey face, solid black outline.
normal-color        = "#000000"
normal-fill-alpha   = 0.25
normal-border       = "#000000"
normal-border-width = 1
normal-border-alpha = 1.0

hover-cursor-color        = "#000000"
hover-cursor-fill-alpha   = 0.35
hover-cursor-border       = "#000000"
hover-cursor-border-width = 2
hover-cursor-border-alpha = 1.0

focus-color        = "#000000"
focus-fill-alpha   = 0.35
focus-border       = "#000000"
focus-border-width = 2
focus-border-alpha = 1.0

selected-color        = "#000080"
selected-fill-alpha   = 0.2
selected-border       = "#000080"
selected-border-width = 2
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.5
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#ffffff"
background-alpha = 1.0
text             = "#000000"
border           = "#000000"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#ffffff"
background-alpha = 1.0
text             = "#000000"
border           = "#000000"
border-alpha     = 1.0

[notifications]
background       = "#c0c0c0"
background-alpha = 1.0
text             = "#000000"
border           = "#000080"
border-alpha     = 1.0
border-width     = 3
countdown        = "#000080"

[launcher]
background                = "#ffffff"
background-alpha          = 1.0
text                      = "#000000"
border                    = "#000000"
border-alpha              = 1.0
scrim                     = "#808080"
scrim-alpha               = 0.25
selected-background       = "#000080"
selected-background-alpha = 1.0
selected-text             = "#ffffff"
selected-border           = "#000080"
selected-border-alpha     = 1.0

[menu]
background                = "#ffffff"
background-alpha          = 1.0
text                      = "#000000"
border                    = "#000000"
border-alpha              = 1.0
scrim                     = "#808080"
scrim-alpha               = 0.25
selected-background       = "#000080"
selected-background-alpha = 1.0
selected-text             = "#ffffff"
selected-border           = "#000080"
selected-border-alpha     = 1.0

[polkit]
background       = "#c0c0c0"
background-alpha = 1.0
text             = "#000000"
text-error       = "#800000"
border           = "#000080"
border-error     = "#ff0000"
border-alpha     = 1.0
scrim            = "#808080"
scrim-alpha      = 0.25
accent           = "#000080"

[lock]
background       = "#ffffff"
background-alpha = 1.0
text             = "#000000"
placeholder      = "#808080"
text-error       = "#800000"
border           = "#000000"
border-active    = "#000080"
border-error     = "#ff0000"
border-alpha     = 1.0
selection        = "#000080"
selection-alpha  = 0.45

[image-picker]
text                    = "#ffffff"
selected-border         = "#000080"
selected-border-alpha   = 1.0
unselected-border       = "#c0c0c0"
unselected-border-alpha = 1.0
