# Phreak — a mid-90s hacking-movie terminal.
# Near-black CRT glass, hot magenta and electric cyan neon, acid-green
# phosphor, and a rainbow of ANSI colours pushed to full saturation, the way
# cyberspace looked on screen when everyone was hacking the planet.
mode = "dark"

accent = "#ff2bd6"
selection = "#3a0d4a"
selection_background = "#3a0d4a"
selection_foreground = "#ffffff"
muted = "#5a4b80"
hyprland_active_border = "rgb(ff2bd6) rgb(00f0ff) 45deg"
hyprland_inactive_border = "rgba(2a2350cc) rgba(1a1638cc) 45deg"

background = "#07051a"
dark_background = "#04030f"
darker_background = "#000000"
lighter_background = "#140f30"

foreground = "#d6f8ff"
dark_foreground = "#6f63a0"
light_foreground = "#a6e9ff"
bright_foreground = "#ffffff"

red = "#ff2e63"
yellow = "#f9f871"
orange = "#ff9100"
green = "#39ff14"
cyan = "#00f0ff"
blue = "#4d7cff"
magenta = "#ff2bd6"
brown = "#c77d1a"

bright_red = "#ff7a9c"
bright_yellow = "#fffcae"
bright_green = "#9dff8a"
bright_cyan = "#8cf9ff"
bright_blue = "#9db4ff"
bright_magenta = "#ff8ff0"
