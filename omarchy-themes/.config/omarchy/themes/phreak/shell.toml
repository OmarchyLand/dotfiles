# Phreak shell surfaces.
# Black CRT glass with neon trim: the bar is translucent black with magenta
# highlights, panels are framed in the neon border, the selected row glows
# magenta, and errors flash hot red.

[bar]
background       = "#04030f"
background-alpha = 0.88
text             = "#00f0ff"
active           = "#ff2bd6"

[hyprland]
active-border            = "rgb(ff2bd6) rgb(00f0ff) 45deg"
active-border-foreground = "#07051a"

[controls]
normal-color        = "#00f0ff"
normal-fill-alpha   = 0.08
normal-border       = "#5a4b80"
normal-border-width = 1
normal-border-alpha = 1.0

hover-cursor-color        = "#ff2bd6"
hover-cursor-fill-alpha   = 0.18
hover-cursor-border       = "#ff2bd6"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 1.0

focus-color        = "#00f0ff"
focus-fill-alpha   = 0.18
focus-border       = "#00f0ff"
focus-border-width = 1
focus-border-alpha = 1.0

selected-color        = "#ff2bd6"
selected-fill-alpha   = 0.25
selected-border       = "#ff2bd6"
selected-border-width = 2
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.4
selection-fill-alpha = 0.35

[popups]
background       = "#04030f"
background-alpha = 0.94
text             = "#d6f8ff"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#000000"
background-alpha = 0.95
text             = "#39ff14"
border           = "#39ff14"
border-alpha     = 1.0

[notifications]
background       = "#04030f"
background-alpha = 0.94
text             = "#d6f8ff"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 2
countdown        = "#ff2bd6"

[launcher]
background                = "#04030f"
background-alpha          = 0.94
text                      = "#00f0ff"
border                    = "hyprland.active-border"
border-alpha              = 1.0
scrim                     = "#000000"
scrim-alpha               = 0.45
selected-background       = "#ff2bd6"
selected-background-alpha = 1.0
selected-text             = "#07051a"
selected-border           = "#ff2bd6"
selected-border-alpha     = 1.0

[menu]
background                = "#04030f"
background-alpha          = 0.94
text                      = "#00f0ff"
border                    = "hyprland.active-border"
border-alpha              = 1.0
scrim                     = "#000000"
scrim-alpha               = 0.45
selected-background       = "#ff2bd6"
selected-background-alpha = 1.0
selected-text             = "#07051a"
selected-border           = "#ff2bd6"
selected-border-alpha     = 1.0

[polkit]
background       = "#04030f"
background-alpha = 0.96
text             = "#d6f8ff"
text-error       = "#ff2e63"
border           = "hyprland.active-border"
border-error     = "#ff2e63"
border-alpha     = 1.0
scrim            = "#000000"
scrim-alpha      = 0.55
accent           = "#ff2bd6"

[lock]
background       = "#000000"
background-alpha = 0.9
text             = "#39ff14"
placeholder      = "#5a4b80"
text-error       = "#ff2e63"
border           = "#5a4b80"
border-active    = "hyprland.active-border"
border-error     = "#ff2e63"
border-alpha     = 1.0
selection        = "#ff2bd6"
selection-alpha  = 0.45

[image-picker]
text                    = "#00f0ff"
selected-border         = "#ff2bd6"
selected-border-alpha   = 1.0
unselected-border       = "#5a4b80"
unselected-border-alpha = 1.0
