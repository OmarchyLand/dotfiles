# Windows 98 shell surfaces.
# The bar is the taskbar: button-face grey with black text. Menus, popups and
# dialogs are grey too, framed in dark grey; the highlighted row is navy with
# white text. Notifications and the lock field wear the navy-to-blue
# title-bar gradient as their frame. Nothing is translucent.

[bar]
background       = "#c0c0c0"
background-alpha = 1.0
text             = "#000000"
active           = "#000080"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "rgb(000080) rgb(1084d0) 0deg"
active-border-foreground = "#000000"

[controls]
# Push buttons: grey face, solid black outline.
normal-color        = "#000000"
normal-fill-alpha   = 0.12
normal-border       = "#808080"
normal-border-width = 1
normal-border-alpha = 1.0

hover-cursor-color        = "#000000"
hover-cursor-fill-alpha   = 0.35
hover-cursor-border       = "#000000"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 1.0

focus-color        = "#000000"
focus-fill-alpha   = 0.35
focus-border       = "#000000"
focus-border-width = 1
focus-border-alpha = 1.0

selected-color        = "#000080"
selected-fill-alpha   = 0.2
selected-border       = "#000080"
selected-border-width = 2
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.5
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#c0c0c0"
background-alpha = 1.0
text             = "#000000"
border           = "#404040"
border-alpha     = 1.0
border-width     = 2

[tooltip]
background       = "#ffffe1"
background-alpha = 1.0
text             = "#000000"
border           = "#000000"
border-alpha     = 1.0

[notifications]
background       = "#c0c0c0"
background-alpha = 1.0
text             = "#000000"
border           = "hyprland.active-border"
border-alpha     = 1.0
border-width     = 3
countdown        = "#000080"

[launcher]
background                = "#c0c0c0"
background-alpha          = 1.0
text                      = "#000000"
border                    = "#404040"
border-alpha              = 1.0
scrim                     = "#808080"
scrim-alpha               = 0.25
selected-background       = "#000080"
selected-background-alpha = 1.0
selected-text             = "#ffffff"
selected-border           = "#000080"
selected-border-alpha     = 1.0

[menu]
background                = "#c0c0c0"
background-alpha          = 1.0
text                      = "#000000"
border                    = "#404040"
border-alpha              = 1.0
scrim                     = "#808080"
scrim-alpha               = 0.25
selected-background       = "#000080"
selected-background-alpha = 1.0
selected-text             = "#ffffff"
selected-border           = "#000080"
selected-border-alpha     = 1.0

[polkit]
background       = "#c0c0c0"
background-alpha = 1.0
text             = "#000000"
text-error       = "#800000"
border           = "hyprland.active-border"
border-error     = "#ff0000"
border-alpha     = 1.0
scrim            = "#808080"
scrim-alpha      = 0.25
accent           = "#000080"

[lock]
background       = "#ffffff"
background-alpha = 1.0
text             = "#000000"
placeholder      = "#808080"
text-error       = "#800000"
border           = "#808080"
border-active    = "hyprland.active-border"
border-error     = "#ff0000"
border-alpha     = 1.0
selection        = "#000080"
selection-alpha  = 0.45

[image-picker]
text                    = "#ffffff"
selected-border         = "#000080"
selected-border-alpha   = 1.0
unselected-border       = "#808080"
unselected-border-alpha = 1.0
