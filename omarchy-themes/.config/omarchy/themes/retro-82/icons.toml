# retro-82 icons: code page 437, like an early PC.
# The apps in ~/Work/apps read this from the current theme (windows live,
# terminal apps at start). A key left out keeps the default; "" hides it.

[icons]

# lists
cursor = "►"
bullet = "∙"
on = "●"
off = "○"

# state
unread = "♦"
replied = "◄"
starred = "☼"
pinned = "↨"
done = "√"
todo = "·"
checked = "▓"
unchecked = "░"
seen = "√"
sensitive = "Θ"
busy = "▒"
warning = "‼"

# kinds of things
play = "►"
live = "◙"
gallery = "▒"
text = "§"
link = "↑"
note = "≡"
totp = "⌐"
upvote = "↑"

# time and place
recurring = "↕"
location = "♠"
birthday = "♥"
countdown = "⌂"
